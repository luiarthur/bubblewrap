name: Build static bwrap binaries

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build static bwrap for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static bwrap
        run: |
          mkdir -p dist
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            alpine:3.23 sh -ec '
              apk add --no-cache \
                build-base linux-headers python3 meson ninja \
                pkgconf git libcap-dev libcap-static

              meson setup build \
                --buildtype=release \
                -Dprefer_static=true \
                -Dc_link_args=-static \
                -Dselinux=disabled \
                -Dman=disabled \
                -Dbash_completion=disabled \
                -Dzsh_completion=disabled \
                -Dtests=false

              meson compile -C build
              install -m 755 build/bwrap "dist/bwrap-${{ matrix.arch }}"
            '

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$RELEASE" --json id >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/bwrap-${{ matrix.arch }} --clobber
          else
            gh release create "$RELEASE" dist/bwrap-${{ matrix.arch }} --generate-notes --title "$RELEASE"
          fi
