name: Build static bwrap binaries

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build static bwrap for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: alpine:3.23
    defaults:
      run:
        shell: sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base linux-headers python3 meson ninja \
            pkgconf git libcap-dev libcap-static github-cli ca-certificates

      - name: Check out
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth=1 --branch "$TAG" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .

      - name: Build static bwrap
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          meson setup build \
            --buildtype=release \
            -Dprefer_static=true \
            -Dc_link_args=-static \
            -Dselinux=disabled \
            -Dman=disabled \
            -Dbash_completion=disabled \
            -Dzsh_completion=disabled \
            -Dtests=false
          meson compile -C build
          mkdir -p dist
          install -m 755 build/bwrap "dist/bwrap-$ARCH"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event.release.tag_name || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          if ! gh release view "$RELEASE" --json id >/dev/null 2>&1; then
            gh release create "$RELEASE" --generate-notes --title "$RELEASE" ||
              gh release view "$RELEASE" --json id >/dev/null
          fi
          gh release upload "$RELEASE" "dist/bwrap-$ARCH" --clobber
